# Builds Muzi EQ and Muzi Glue on a Mac on every push, checks them with pluginval,
# and offers the finished VST3 / AU / Standalone as downloads (Actions tab > latest run > Artifacts).
name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: MuziEQ
            name: Muzi EQ
          - folder: MuziGlue
            name: Muzi Glue
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} (Xcode project generated by Projucer, Release, Universal)
        run: |
          xcodebuild -project "${{ matrix.folder }}/Builds/MacOSX/${{ matrix.name }}.xcodeproj" \
                     -target "${{ matrix.name }} - All" -configuration Release \
                     ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" -quiet build

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests \
            --validate "${{ matrix.folder }}/Builds/MacOSX/build/Release/${{ matrix.name }}.vst3"

      - name: Package
        run: |
          B="${{ matrix.folder }}/Builds/MacOSX/build/Release"
          mkdir -p dist
          cp -R "$B/${{ matrix.name }}.vst3" "$B/${{ matrix.name }}.component" "$B/${{ matrix.name }}.app" dist/
          cp README.md dist/
          cat > dist/INSTALL.txt <<TXT
          1. Copy "${{ matrix.name }}.vst3" to ~/Library/Audio/Plug-Ins/VST3/
          2. Copy "${{ matrix.name }}.component" to ~/Library/Audio/Plug-Ins/Components/
          3. These builds are not signed with an Apple developer certificate, so run once in Terminal:
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"${{ matrix.name }}.vst3" ~/Library/Audio/Plug-Ins/Components/"${{ matrix.name }}.component"
          4. Rescan plugins in your DAW.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder }}-macOS
          path: dist
          retention-days: 30
